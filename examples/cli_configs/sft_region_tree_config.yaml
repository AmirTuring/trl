# SFT VLM Training Configuration for Region-Adjacency Tree Task
# Supervised fine-tuning a VLM to generate region-adjacency trees from images of non-crossing closed curves
# Dataset: https://huggingface.co/datasets/AmirMohseni/curvebench

# Dataset configuration - CurveBench
datasets:
  - path: AmirMohseni/curvebench
    split: train

# Validation dataset
validation_datasets:
  - path: AmirMohseni/curvebench
    split: val

# Field mapping - map dataset fields
field_mapping:
  image_field: image
  num_nodes_field: num_nodes
  tree_field: tree

# Model configuration
model_name_or_path: google/gemma-3-4b-it
model_revision: main
torch_dtype: bfloat16
trust_remote_code: true

# Training configuration
output_dir: runs/sft-region-tree-gemma-3-4b
max_steps: 400
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

# SFT specific parameters
max_length: 4096

# Logging configuration
logging_strategy: steps
logging_steps: 1
save_strategy: steps
save_steps: 50
save_total_limit: 3

# Evaluation configuration
eval_strategy: steps
eval_steps: 50
eval_on_start: false

# Script-specific arguments
dataset_seed: 42

# PEFT/LoRA configuration
use_peft: true
lora_r: 4
lora_alpha: 8
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"

# Reporting
report_to: 
  - wandb
run_name: sft-region-tree-gemma-3-4b
project_name: curvebench

# Hugging Face Hub (optional)
push_to_hub: true
hub_strategy: every_save
hub_model_id: AmirMohseni/sft-region-tree-gemma-3-4b

# Additional VLM-specific optimizations
dataloader_num_workers: 2
dataloader_pin_memory: true
remove_unused_columns: false
