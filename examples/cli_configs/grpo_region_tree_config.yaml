# GRPO VLM Training Configuration for Region-Adjacency Tree Task
# Training a VLM to generate region-adjacency trees from images of non-crossing closed curves
# Dataset: https://huggingface.co/datasets/AmirMohseni/curvebench

# Dataset configuration - CurveBench
datasets:
  - path: AmirMohseni/CurveBench-Easy
    split: total_train

# Validation dataset
validation_datasets:
  - path: AmirMohseni/CurveBench-Easy
    split: total_validation

# Field mapping - map dataset fields
field_mapping:
  image_field: image
  num_nodes_field: num_nodes
  tree_field: tree

# Model configuration
model_name_or_path: Qwen/Qwen3-VL-8B-Thinking
model_revision: main
torch_dtype: bfloat16
trust_remote_code: true
attn_implementation: flash_attention_2

# Training configuration
output_dir: runs/grpo-region-tree-qwen3-vl-8b-thinking
#num_train_epochs: 3
max_steps: 200
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 8.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

# GRPO specific parameters
beta: 0.001
loss_type: "dr_grpo"
max_prompt_length: 4096
max_completion_length: 4096
num_generations: 8
reward_weights: [0.7, 0.3]  # [tree_correctness_reward, num_nodes_reward]

# VLLM configuration for fast generation
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.6

# Logging configuration
logging_strategy: steps
logging_steps: 1
save_strategy: steps
save_steps: 20
save_total_limit: 3
log_completions: true
#num_completions_to_print: 3

# Evaluation configuration
eval_strategy: steps
eval_steps: 20
eval_on_start: true

# Script-specific arguments
dataset_seed: 42
task_mode: tree  # Options: 'tree' for full tree generation, 'num_nodes' for counting task

# PEFT/LoRA configuration
use_peft: true
lora_r: 2
lora_alpha: 4
lora_task_type: "CAUSAL_LM"
lora_target_modules: "all-linear"

# Reporting
report_to: 
  - wandb
run_name: grpo-region-tree-qwen3-vl-8b-thinking
project_name: curvebench

# Hugging Face Hub (optional)
push_to_hub: true
hub_strategy: every_save
hub_model_id: AmirMohseni/grpo-region-tree-qwen3-vl-8b-thinking

# Additional VLM-specific optimizations
dataloader_num_workers: 8
dataloader_pin_memory: true
remove_unused_columns: false
